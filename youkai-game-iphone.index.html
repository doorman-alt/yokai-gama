<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>妖怪コレクトバトル</title>
<style>
  :root{
    --bg:#1a1033; --panel:#2b1c52; --accent:#ffcf4d; --text:#f5f0ff; --hp:#7ee787; --hp-low:#ff6b6b;
    box-sizing:border-box; padding-top:env(safe-area-inset-top,0); padding-bottom:env(safe-area-inset-bottom,0);
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0; font-family:"Hiragino Sans","Yu Gothic",sans-serif;
    background:radial-gradient(circle at top, #3a2470, var(--bg));
    color:var(--text); display:flex; justify-content:center;
  }
  #app{width:100%; max-width:480px; padding:16px; display:flex; flex-direction:column; gap:12px;}
  h1{font-size:1.2rem; text-align:center; margin:4px 0; color:var(--accent);}
  .panel{background:var(--panel); border-radius:14px; padding:12px; box-shadow:0 4px 10px rgba(0,0,0,.3);}
  .row{display:flex; justify-content:space-between; align-items:center; gap:8px;}
  .yk{font-size:2.6rem; text-align:center; position:relative;}
  .bar-bg{background:#3d2a6b; border-radius:8px; height:14px; overflow:hidden; margin-top:4px;}
  .bar-fill{height:100%; background:var(--hp); transition:width .3s;}
  .bar-fill.low{background:var(--hp-low);}
  .stats{font-size:.75rem; opacity:.85; margin-top:3px; display:flex; gap:10px;}
  button{
    background:var(--accent); color:#3a2470; border:none; border-radius:10px;
    padding:10px 14px; font-weight:bold; font-size:.95rem; cursor:pointer;
  }
  button:disabled{opacity:.4;}
  button.secondary{background:#4a3487; color:var(--text);}
  .actions{display:flex; flex-wrap:wrap; gap:8px; justify-content:center;}
  #log{height:110px; overflow-y:auto; font-size:.85rem; background:#150c2c; border-radius:10px; padding:8px; line-height:1.5;}
  #collection{display:grid; grid-template-columns:repeat(4,1fr); gap:6px;}
  .medal{text-align:center; font-size:1.6rem; background:#150c2c; border-radius:8px; padding:6px 2px; opacity:.25;}
  .medal.got{opacity:1;}
  .medal.got.rare{box-shadow:0 0 0 2px var(--accent) inset;}
  .medal.active{box-shadow:0 0 0 2px #6ecbff inset; background:#22315f;}
  .medal.got.boss{box-shadow:0 0 0 2px #ff4d4d inset; background:#3a1010;}

  #bossFlash{
    position:fixed; inset:0; z-index:999;
    background:radial-gradient(circle, rgba(255,0,0,.35), rgba(0,0,0,.85));
    display:flex; align-items:center; justify-content:center;
    animation:flashPulse 1.4s ease-out forwards;
  }
  #bossText{
    font-size:1.8rem; font-weight:bold; color:#ff4d4d;
    text-shadow:0 0 12px #ff0000, 0 0 24px #ff0000;
    animation:textPop 1.4s ease-out forwards;
  }
  @keyframes flashPulse{
    0%{opacity:0;}
    15%{opacity:1;}
    80%{opacity:1;}
    100%{opacity:0;}
  }
  @keyframes textPop{
    0%{transform:scale(.3); opacity:0;}
    20%{transform:scale(1.3); opacity:1;}
    35%{transform:scale(1);}
    85%{transform:scale(1); opacity:1;}
    100%{transform:scale(1); opacity:0;}
  }
  #app.shake{animation:shakeApp .5s ease-in-out 2;}
  @keyframes shakeApp{
    0%,100%{transform:translateX(0);}
    20%{transform:translateX(-8px);}
    40%{transform:translateX(8px);}
    60%{transform:translateX(-6px);}
    80%{transform:translateX(6px);}
  }
  .guard-badge{
    position:absolute; top:-14px; left:50%; transform:translate(-50%,0);
    font-size:1.3rem; font-weight:bold; background:#132048; color:#9fd4ff; padding:6px 18px;
    border-radius:24px; box-shadow:0 0 22px #4a90e2, 0 0 40px #2f5fb0; white-space:nowrap;
    animation:guardPop 1.1s ease-out forwards; z-index:10;
  }
  @keyframes guardPop{
    0%{opacity:0; transform:translate(-50%,10px) scale(.4);}
    18%{opacity:1; transform:translate(-50%,-14px) scale(1.5);}
    55%{opacity:1; transform:translate(-50%,-14px) scale(1.1);}
    85%{opacity:1; transform:translate(-50%,-14px) scale(1.1);}
    100%{opacity:0; transform:translate(-50%,-30px) scale(.9);}
  }
  .guard-flash{animation:guardGlow 1.1s ease-out;}
  @keyframes guardGlow{
    0%{filter:drop-shadow(0 0 0px #4a90e2); transform:scale(1);}
    20%{filter:drop-shadow(0 0 26px #4a90e2); transform:scale(1.25);}
    55%{filter:drop-shadow(0 0 20px #4a90e2); transform:scale(1.05);}
    100%{filter:drop-shadow(0 0 0px #4a90e2); transform:scale(1);}
  }
  .hit-badge{
    position:absolute; top:-10px; left:50%; transform:translate(-50%,0);
    font-size:1.1rem; font-weight:bold; background:#3a1010; color:#ff9d6b; padding:5px 15px;
    border-radius:22px; box-shadow:0 0 16px #ff5a3c, 0 0 30px #b22; white-space:nowrap;
    animation:hitPop .9s ease-out forwards; z-index:10;
  }
  @keyframes hitPop{
    0%{opacity:0; transform:translate(-50%,6px) scale(.5);}
    18%{opacity:1; transform:translate(-50%,-10px) scale(1.3);}
    60%{opacity:1; transform:translate(-50%,-10px) scale(1);}
    100%{opacity:0; transform:translate(-50%,-22px) scale(.9);}
  }
  .hit-flash{animation:hitShake .5s ease-out;}
  @keyframes hitShake{
    0%{filter:drop-shadow(0 0 0px #ff5a3c); transform:translateX(0) scale(1);}
    20%{filter:drop-shadow(0 0 18px #ff5a3c); transform:translateX(-6px) scale(1.1);}
    40%{transform:translateX(6px) scale(1.05);}
    60%{transform:translateX(-4px);}
    100%{filter:drop-shadow(0 0 0px #ff5a3c); transform:translateX(0) scale(1);}
  }
  .faint-badge{
    position:absolute; top:-14px; left:50%; transform:translate(-50%,0);
    font-size:1.15rem; font-weight:bold; background:#1a1a1a; color:#c9c9c9; padding:6px 16px;
    border-radius:22px; box-shadow:0 0 18px #000, 0 0 10px #555; white-space:nowrap;
    animation:faintPop 1.3s ease-out forwards; z-index:11;
  }
  @keyframes faintPop{
    0%{opacity:0; transform:translate(-50%,6px) scale(.6);}
    20%{opacity:1; transform:translate(-50%,-10px) scale(1.1);}
    70%{opacity:1;}
    100%{opacity:0; transform:translate(-50%,-20px) scale(.9);}
  }
  .faint-flash{animation:faintFall 1.3s ease-in forwards;}
  @keyframes faintFall{
    0%{opacity:1; transform:translateY(0) rotate(0deg); filter:grayscale(0);}
    60%{opacity:.5; transform:translateY(14px) rotate(12deg); filter:grayscale(.8);}
    100%{opacity:.15; transform:translateY(22px) rotate(16deg); filter:grayscale(1);}
  }
  #gameOverOverlay{
    position:fixed; inset:0; z-index:1000;
    background:rgba(0,0,0,.92);
    display:flex; align-items:center; justify-content:center;
    animation:goFadeIn .5s ease-out;
  }
  #gameOverText{
    font-size:2rem; font-weight:bold; color:#ff3b3b; letter-spacing:.15em;
    text-shadow:0 0 16px #ff0000, 0 0 30px #7a0000;
    animation:goPulse 1.2s ease-in-out infinite;
  }
  @keyframes goFadeIn{ from{opacity:0;} to{opacity:1;} }
  @keyframes goPulse{
    0%,100%{transform:scale(1);}
    50%{transform:scale(1.08);}
  }
  .medal small{display:block; font-size:.55rem; margin-top:2px;}

  /* ===== 派手な戦闘演出 ===== */
  #battleArea{position:relative; overflow:visible;}
  #battleArea.impact{animation:battleImpact .28s ease-out;}
  @keyframes battleImpact{
    0%{transform:scale(1)}
    35%{transform:scale(1.025) translateX(-3px)}
    65%{transform:scale(.99) translateX(3px)}
    100%{transform:scale(1)}
  }
  .yk{transition:filter .15s, transform .15s;}
  .attack-lunge-player{animation:lungePlayer .38s cubic-bezier(.2,.8,.2,1);}
  .attack-lunge-enemy{animation:lungeEnemy .38s cubic-bezier(.2,.8,.2,1);}
  @keyframes lungePlayer{
    0%{transform:translateX(0) scale(1)}
    35%{transform:translateX(34px) scale(1.18)}
    100%{transform:translateX(0) scale(1)}
  }
  @keyframes lungeEnemy{
    0%{transform:translateX(0) scale(1)}
    35%{transform:translateX(-34px) scale(1.18)}
    100%{transform:translateX(0) scale(1)}
  }
  .mega-hit{
    position:fixed; inset:0; z-index:1200; pointer-events:none;
    display:flex; align-items:center; justify-content:center;
    background:radial-gradient(circle,rgba(255,255,255,.85),rgba(255,70,20,.28) 28%,transparent 65%);
    animation:megaFlash .55s ease-out forwards;
  }
  .mega-hit span{
    font-size:clamp(2.3rem,12vw,5rem); font-weight:900;
    color:#fff; text-shadow:0 0 8px #ffef8a,0 0 20px #ff4d00,0 0 45px #ff0000;
    transform:scale(.35) rotate(-8deg);
    animation:megaText .55s cubic-bezier(.15,.8,.2,1) forwards;
  }
  @keyframes megaFlash{
    0%{opacity:0} 12%{opacity:1} 100%{opacity:0}
  }
  @keyframes megaText{
    0%{opacity:0;transform:scale(.35) rotate(-8deg)}
    25%{opacity:1;transform:scale(1.28) rotate(3deg)}
    55%{transform:scale(1) rotate(-1deg)}
    100%{opacity:0;transform:scale(1.08) rotate(0)}
  }
  .damage-number{
    position:absolute; left:50%; top:5%; z-index:20; pointer-events:none;
    font-size:1.7rem; font-weight:900; color:#fff;
    text-shadow:0 3px 0 #8a1600,0 0 12px #ff6a00;
    animation:damageFloat .8s ease-out forwards;
  }
  .damage-number.critical{font-size:2.25rem;color:#ffe96a;text-shadow:0 3px 0 #8a3d00,0 0 18px #ffb000,0 0 30px #ff3b00;}
  @keyframes damageFloat{
    0%{opacity:0;transform:translate(-50%,15px) scale(.45) rotate(-5deg)}
    18%{opacity:1;transform:translate(-50%,-5px) scale(1.35) rotate(4deg)}
    65%{opacity:1;transform:translate(-50%,-32px) scale(1)}
    100%{opacity:0;transform:translate(-50%,-70px) scale(.9)}
  }
  .critical-banner{
    position:fixed;left:50%;top:38%;z-index:1300;pointer-events:none;
    transform:translate(-50%,-50%) skew(-8deg);
    font-size:clamp(1.7rem,8vw,3.4rem);font-weight:1000;letter-spacing:.08em;
    color:#fff;background:linear-gradient(90deg,#ff3b00,#ffd000,#ff3b00);
    padding:8px 22px;border-radius:14px;
    box-shadow:0 0 15px #ff5a00,0 0 45px #ff1600;
    animation:critBanner .75s cubic-bezier(.15,.8,.2,1) forwards;
  }
  @keyframes critBanner{
    0%{opacity:0;transform:translate(-50%,-50%) scale(.25) skew(-8deg)}
    20%{opacity:1;transform:translate(-50%,-50%) scale(1.25) skew(-8deg)}
    50%{transform:translate(-50%,-50%) scale(.98) skew(-8deg)}
    100%{opacity:0;transform:translate(-50%,-50%) scale(1.05) skew(-8deg)}
  }
  .slash{
    position:fixed;left:50%;top:50%;width:120vw;height:8px;z-index:1250;
    pointer-events:none;background:linear-gradient(90deg,transparent,#fff,#fff,#ff3b00,transparent);
    box-shadow:0 0 14px #fff,0 0 30px #ff4d00;
    transform:translate(-50%,-50%) rotate(-18deg) scaleX(0);
    animation:slash .32s ease-out forwards;
  }
  @keyframes slash{
    0%{opacity:0;transform:translate(-50%,-50%) rotate(-18deg) scaleX(0)}
    25%{opacity:1;transform:translate(-50%,-50%) rotate(-18deg) scaleX(1)}
    100%{opacity:0;transform:translate(-50%,-50%) rotate(-18deg) scaleX(1.15)}
  }
  .ko-burst{
    position:fixed;left:50%;top:50%;z-index:1250;pointer-events:none;
    font-size:clamp(2.2rem,11vw,4.5rem);font-weight:1000;color:#fff;
    text-shadow:0 0 10px #ff0000,0 0 30px #ff5a00,0 0 50px #ffd000;
    animation:koBurst .9s ease-out forwards;
  }
  @keyframes koBurst{
    0%{opacity:0;transform:translate(-50%,-50%) scale(.2) rotate(-12deg)}
    25%{opacity:1;transform:translate(-50%,-50%) scale(1.3) rotate(4deg)}
    55%{transform:translate(-50%,-50%) scale(1)}
    100%{opacity:0;transform:translate(-50%,-50%) scale(1.3)}
  }
  .boss-intense{
    animation:bossIntense .9s ease-out;
  }
  @keyframes bossIntense{
    0%{filter:brightness(1)}
    20%{filter:brightness(2.2) saturate(1.8)}
    45%{filter:brightness(.75) saturate(2)}
    70%{filter:brightness(1.8) saturate(1.7)}
    100%{filter:brightness(1)}
  }
  .spark{
    position:fixed;width:7px;height:7px;border-radius:50%;z-index:1240;pointer-events:none;
    background:#fff;box-shadow:0 0 8px #ffcf4d,0 0 16px #ff5a00;
    animation:sparkFly .65s ease-out forwards;
  }
  @keyframes sparkFly{
    from{opacity:1;transform:translate(0,0) scale(1)}
    to{opacity:0;transform:translate(var(--dx),var(--dy)) scale(.1)}
  }

</style>

<style id="iphone-optimization">
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;touch-action:manipulation;background:#111}
body{margin:0;min-height:100dvh;padding:max(0px,env(safe-area-inset-top)) max(0px,env(safe-area-inset-right)) max(0px,env(safe-area-inset-bottom)) max(0px,env(safe-area-inset-left));overscroll-behavior:none;-webkit-tap-highlight-color:transparent}
button,.btn,[role="button"]{-webkit-appearance:none;appearance:none;touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;min-height:48px}
@media(max-width:390px){button,.btn{min-height:50px;font-size:14px}}
@media(orientation:landscape) and (max-height:500px){button,.btn{min-height:42px}}
.battle-area,.actions,.collection,.log,.youkai-card{-webkit-user-select:none;user-select:none}
</style>
</head>
<body>
<div id="app">
  <h1>🏯 妖怪コレクトバトル 🏯</h1>
  <div style="text-align:center;">
    <button class="secondary" onclick="forceBoss()">💀 ボスを呼び出す</button>
  </div>

  <div class="panel" id="battleArea">
    <div class="row">
      <div style="flex:1">
        <div>あなたの妖怪：<b id="playerName"></b></div>
        <div class="bar-bg"><div class="bar-fill" id="playerBar"></div></div>
        <div class="stats" id="playerStats"></div>
      </div>
    </div>
    <div class="yk" id="playerEmoji"></div>
    <div style="text-align:center; margin:6px 0;">⚔️ VS ⚔️</div>
    <div class="yk" id="enemyEmoji"></div>
    <div class="row">
      <div style="flex:1">
        <div>てきの妖怪：<b id="enemyName"></b></div>
        <div class="bar-bg"><div class="bar-fill" id="enemyBar"></div></div>
        <div class="stats" id="enemyStats"></div>
      </div>
    </div>
  </div>

  <div class="actions" id="actions"></div>

  <div class="panel">
    <div class="row"><b>集めた妖怪メダル</b><span id="count">0/8</span></div>
    <div style="font-size:.75rem; opacity:.7; margin-bottom:4px;">メダルをタップすると戦闘に出せます</div>
    <div id="collection"></div>
  </div>
</div>

<script>
const YOUKAI = [
  {name:"ぷるもん", emoji:"👻", hp:21, atk:8, def:3, spd:12},
  {name:"かぜたぬき", emoji:"🦝", hp:23, atk:7, def:4, spd:9},
  {name:"ひかりねこ", emoji:"🐱", hp:19, atk:9, def:2, spd:15},
  {name:"いわおとこ", emoji:"🗿", hp:30, atk:6, def:7, spd:5},
  {name:"あめだま", emoji:"🍬", hp:18, atk:10, def:1, spd:18},
  {name:"つきうさぎ", emoji:"🐰", hp:22, atk:8, def:3, spd:16},
  {name:"ほのおとり", emoji:"🐓", hp:20, atk:9, def:2, spd:13},
  {name:"みずへび", emoji:"🐍", hp:24, atk:7, def:4, spd:10},
];

const RARE_YOUKAI = [
  {name:"らいじんまる", emoji:"🐉", hp:48, atk:16, def:6, spd:20, rare:true},
  {name:"おにがしら", emoji:"👹", hp:53, atk:15, def:8, spd:8, rare:true},
  {name:"こんじきぎつね", emoji:"🦊", hp:44, atk:18, def:5, spd:22, rare:true},
];

const BOSS_YOUKAI = [
  {name:"だいまおう・こくえん", emoji:"💀", hp:240, atk:26, def:14, spd:6, boss:true},
];

let player, enemy, collection = [];
let youkaiHp = {}; // 妖怪ごとの現在HPを記憶（回復しない）

function statsFor(base){
  if(base.boss){
    const hp = Math.max(1, Math.round(base.hp*0.1));
    return {maxHp:hp, atk:20, def:10, spd:5};
  }
  return {maxHp:base.hp+5, atk:base.atk+2, def:base.def, spd:base.spd};
}
let canCatch = false;

function rand(a){return a[Math.floor(Math.random()*a.length)];}

function pickRare(){
  // らいじんまるが他より出やすいよう重み付け
  const pool = [RARE_YOUKAI[0], RARE_YOUKAI[0], RARE_YOUKAI[1], RARE_YOUKAI[2]];
  return rand(pool);
}

function newBattle(){
  const roll = Math.random();
  const isBoss = roll < 0.01;
  const isRare = !isBoss && roll < 0.11;
  const base = isBoss ? rand(BOSS_YOUKAI) : (isRare ? pickRare() : rand(YOUKAI));
  if(!player){
    const p = YOUKAI.find(y => y.name === "かぜたぬき");
    const s = statsFor(p);
    player = {name:p.name, emoji:p.emoji, hp:s.maxHp, maxHp:s.maxHp, atk:s.atk, def:s.def, spd:s.spd};
    youkaiHp[p.name] = s.maxHp;
  }
  enemy = {...base, hp:base.hp, maxHp:base.hp};
  canCatch = false;
  render();
  if(isBoss){
    playBossIntro();
    log(`💀💀💀 ${enemy.name}が姿を現した…！ 💀💀💀`);
  } else if(isRare){
    log(`✨強い気配…！ 強力な${enemy.name}が現れた！✨`);
  } else {
    log(`野生の${enemy.name}が現れた！`);
  }
}

function forceBoss(){
  const base = rand(BOSS_YOUKAI);
  if(!player){
    const p = YOUKAI.find(y => y.name === "かぜたぬき");
    const s = statsFor(p);
    player = {name:p.name, emoji:p.emoji, hp:s.maxHp, maxHp:s.maxHp, atk:s.atk, def:s.def, spd:s.spd};
    youkaiHp[p.name] = s.maxHp;
  }
  enemy = {...base, hp:base.hp, maxHp:base.hp};
  canCatch = false;
  render();
  playBossIntro();
  log(`💀💀💀 ${enemy.name}が姿を現した…！ 💀💀💀`);
}

function playBossIntro(){
  const flash = document.createElement('div');
  flash.id = 'bossFlash';
  flash.innerHTML = `<div id="bossText">⚠️ ボス出現 ⚠️</div>`;
  document.body.appendChild(flash);
  document.getElementById('app').classList.add('shake','boss-intense');
  setTimeout(()=>{
    flash.remove();
    document.getElementById('app').classList.remove('shake','boss-intense');
  }, 1400);
}

function log(msg){
  // ログ表示は廃止（何もしない）
}

function render(){
  document.getElementById('playerName').textContent = player.name;
  document.getElementById('playerEmoji').textContent = player.emoji;
  document.getElementById('enemyName').textContent = enemy.name;
  document.getElementById('enemyEmoji').textContent = enemy.emoji;

  document.getElementById('playerStats').innerHTML =
    `HP ${Math.max(0,player.hp)}/${player.maxHp} ・ 攻${player.atk} ・ 防${player.def} ・ 速${player.spd}`;
  document.getElementById('enemyStats').innerHTML =
    `HP ${Math.max(0,enemy.hp)}/${enemy.maxHp} ・ 攻${enemy.atk} ・ 防${enemy.def} ・ 速${enemy.spd}`;

  const pPct = Math.max(0, player.hp/player.maxHp*100);
  const ePct = Math.max(0, enemy.hp/enemy.maxHp*100);
  const pBar = document.getElementById('playerBar');
  const eBar = document.getElementById('enemyBar');
  pBar.style.width = pPct+'%';
  eBar.style.width = ePct+'%';
  pBar.className = 'bar-fill'+(pPct<30?' low':'');
  eBar.className = 'bar-fill'+(ePct<30?' low':'');

  renderActions();
  renderCollection();
}

function renderActions(){
  const box = document.getElementById('actions');
  box.innerHTML = '';
  if(player.hp<=0){
    box.innerHTML = `<div style="width:100%;text-align:center;">あなたの妖怪はダウンした…</div>`;
    addBtn('もう一度挑戦する', () => { player = null; newBattle(); });
    return;
  }
  if(enemy.hp<=0){
    box.innerHTML = `<div style="width:100%;text-align:center;">${enemy.name}を倒した！</div>`;
    addBtn('次の妖怪へ', () => newBattle());
    return;
  }
  addBtn('こうげき', attack);
  addBtn('ぼうぎょ', defend, true, 'secondary');
  addBtn('全回復', fullHeal, player.hp < player.maxHp, 'secondary');
  addBtn('メダルにする', tryCatch, enemy.hp<=enemy.maxHp*0.5, 'secondary');
  addBtn('🏃 逃げる', escapeBattle, true, 'secondary');
}


function escapeBattle(){
  const success = Math.random() < 0.75; // 75%で逃走成功
  const box = document.getElementById('actions');
  box.querySelectorAll('button').forEach(b => b.disabled = true);

  if(success){
    const fx = document.createElement('div');
    fx.className = 'mega-hit';
    fx.innerHTML = '<span>🏃💨 逃走成功！</span>';
    document.body.appendChild(fx);
    setTimeout(()=>{
      fx.remove();
      newBattle();
    }, 650);
  }else{
    const fx = document.createElement('div');
    fx.className = 'mega-hit';
    fx.innerHTML = '<span>😱 逃げられない！</span>';
    document.body.appendChild(fx);
    setTimeout(()=>fx.remove(), 600);

    // 逃走失敗時は敵の反撃
    const edmg = Math.max(1, enemy.atk - player.def + Math.floor(Math.random()*4));
    if(applyPlayerDamage(edmg)) return;
    render();
  }
}

function addBtn(text, fn, enabled=true, cls=''){
  const b = document.createElement('button');
  b.textContent = text;
  b.className = cls;
  b.disabled = !enabled;
  b.onclick = fn;
  document.getElementById('actions').appendChild(b);
}

function attack(){
  const enemyDefending = Math.random() < 0.25;
  const critical = Math.random() < 0.12;
  const base = Math.max(1, player.atk - enemy.def);
  const multiplier = 0.8 + Math.random() * 0.4;
  let dmg = Math.max(1, Math.round(base * multiplier));
  if(critical) dmg = Math.round(dmg * 2);
  if(enemyDefending) dmg = Math.max(1, Math.round(dmg * 0.5));

  function playerHits(){
    enemy.hp -= dmg;
    if(enemy.hp < 0) enemy.hp = 0;
    flashyAttack('playerEmoji','enemyEmoji',dmg,critical,enemyDefending);
    if(enemy.hp<=0) playKOEffect('enemyEmoji');
    else if(enemyDefending) playEnemyGuardEffect();
    else playHitEffect('enemyEmoji');
  }

  function enemyHits(){
    const edmg = Math.max(1, enemy.atk - player.def + Math.floor(Math.random()*4));
    return applyPlayerDamage(edmg);
  }

  if(player.spd >= enemy.spd){
    playerHits();
    if(enemy.hp<=0){ render(); return; }
    if(enemyHits()) return;
  } else {
    if(enemyHits()) return;
    playerHits();
  }
  render();
}

function flashyAttack(fromId,toId,dmg,critical,guard){
  const from = document.getElementById(fromId);
  if(from){
    from.classList.remove('attack-lunge-player','attack-lunge-enemy');
    void from.offsetWidth;
    from.classList.add(fromId==='playerEmoji'?'attack-lunge-player':'attack-lunge-enemy');
    setTimeout(()=>from.classList.remove('attack-lunge-player','attack-lunge-enemy'),400);
  }
  const area=document.getElementById('battleArea');
  area.classList.remove('impact'); void area.offsetWidth; area.classList.add('impact');
  setTimeout(()=>area.classList.remove('impact'),300);

  const slash=document.createElement('div');
  slash.className='slash'; document.body.appendChild(slash);
  setTimeout(()=>slash.remove(),330);

  if(critical && !guard){
    const banner=document.createElement('div');
    banner.className='critical-banner'; banner.textContent='🔥 CRITICAL HIT!! 🔥';
    document.body.appendChild(banner);
    setTimeout(()=>banner.remove(),760);
  }

  const target=document.getElementById(toId);
  if(target){
    const n=document.createElement('div');
    n.className='damage-number'+(critical?' critical':'');
    n.textContent=(critical?'💥 ':'-')+dmg+(critical?' CRITICAL!':'');
    target.appendChild(n);
    setTimeout(()=>n.remove(),820);
  }
  spawnSparks(critical?20:10);
  if(critical) bigFlash('🔥 超絶クリティカル！ 🔥');
}

function spawnSparks(count){
  for(let i=0;i<count;i++){
    const s=document.createElement('div');
    s.className='spark';
    s.style.left=(35+Math.random()*30)+'%';
    s.style.top=(35+Math.random()*30)+'%';
    s.style.setProperty('--dx',((Math.random()-.5)*260)+'px');
    s.style.setProperty('--dy',((Math.random()-.5)*220)+'px');
    document.body.appendChild(s);
    setTimeout(()=>s.remove(),700);
  }
}

function bigFlash(text){
  const f=document.createElement('div');
  f.className='mega-hit';
  f.innerHTML='<span>'+text+'</span>';
  document.body.appendChild(f);
  setTimeout(()=>f.remove(),600);
}

function playKOEffect(targetId){
  const el=document.getElementById(targetId);
  if(el){el.classList.add('faint-flash'); setTimeout(()=>el.classList.remove('faint-flash'),900);}
  const ko=document.createElement('div');
  ko.className='ko-burst'; ko.textContent='💥 K.O.!! 💥';
  document.body.appendChild(ko);
  spawnSparks(28);
  setTimeout(()=>ko.remove(),920);
}

function playEnemyGuardEffect(){
  const el = document.getElementById('enemyEmoji');
  const badge = document.createElement('div');
  badge.className = 'guard-badge';
  badge.textContent = '🛡️ ガード！';
  el.appendChild(badge);
  el.classList.add('guard-flash');
  setTimeout(()=>{
    badge.remove();
    el.classList.remove('guard-flash');
  }, 1100);
}

function playHitEffect(targetId){
  const el = document.getElementById(targetId);
  const badge = document.createElement('div');
  badge.className = 'hit-badge';
  badge.textContent = '💥 ヒット！';
  el.appendChild(badge);
  el.classList.add('hit-flash');
  setTimeout(()=>{
    badge.remove();
    el.classList.remove('hit-flash');
  }, 900);
}

function playFaintEffect(targetId){
  const el = document.getElementById(targetId);
  const badge = document.createElement('div');
  badge.className = 'faint-badge';
  badge.textContent = '💫 戦闘不能...';
  el.appendChild(badge);
  el.classList.add('faint-flash');
  setTimeout(()=>{
    badge.remove();
    el.classList.remove('faint-flash');
  }, 1300);
}

function fullHeal(){
  player.hp = player.maxHp;
  youkaiHp[player.name] = player.hp;
  const edmg = Math.max(1, enemy.atk - player.def + Math.floor(Math.random()*4));
  if(applyPlayerDamage(edmg)) return;
  render();
}

function defend(){
  let edmg = Math.max(1, enemy.atk - player.def + Math.floor(Math.random()*4));
  edmg = Math.max(0, Math.round(edmg * 0.1));
  if(applyPlayerDamage(edmg)) return;
  render();
}

// プレイヤーの妖怪にダメージを与える共通処理。倒れた場合はtrueを返し、
// 自動で次の捕獲済み妖怪に切り替えるか、いなければゲームオーバー処理を行う。
function applyPlayerDamage(dmg){
  player.hp -= dmg;
  if(player.hp<=0){
    player.hp = 0;
    document.getElementById('actions').innerHTML = '';
    const bar = document.getElementById('playerBar');
    if(bar){ bar.style.width = '0%'; bar.className = 'bar-fill low'; }
    const statsEl = document.getElementById('playerStats');
    if(statsEl){ statsEl.innerHTML = `HP 0/${player.maxHp} ・ 攻${player.atk} ・ 防${player.def} ・ 速${player.spd}`; }
    playFaintEffect('playerEmoji');
    removeFromCollection(player.name);
    setTimeout(()=>{ handlePlayerDefeat(); }, 1100);
    return true;
  } else {
    const target = document.getElementById('playerEmoji');
    if(target){
      const n=document.createElement('div');
      n.className='damage-number';
      n.textContent='💢 -'+dmg;
      target.appendChild(n);
      setTimeout(()=>n.remove(),820);
    }
    const area=document.getElementById('battleArea');
    area.classList.remove('impact'); void area.offsetWidth; area.classList.add('impact');
    setTimeout(()=>area.classList.remove('impact'),300);
    spawnSparks(8);
    playHitEffect('playerEmoji');
    youkaiHp[player.name] = player.hp;
    return false;
  }
}

function handlePlayerDefeat(){
  if(collection.length > 0){
    const nextName = collection[0];
    const all = YOUKAI.concat(RARE_YOUKAI, BOSS_YOUKAI);
    const base = all.find(y=>y.name===nextName);
    const s = statsFor(base);
    const stored = youkaiHp.hasOwnProperty(nextName) ? youkaiHp[nextName] : s.maxHp;
    player = {name:base.name, emoji:base.emoji, hp:Math.min(stored, s.maxHp), maxHp:s.maxHp, atk:s.atk, def:s.def, spd:s.spd};
    render();
  } else {
    showGameOver();
  }
}

function showGameOver(){
  const overlay = document.createElement('div');
  overlay.id = 'gameOverOverlay';
  overlay.innerHTML = `<div id="gameOverText">💀 GAME OVER 💀</div>`;
  document.body.appendChild(overlay);
  setTimeout(()=>{
    overlay.remove();
    resetGame();
  }, 1800);
}

function resetGame(){
  player = null;
  enemy = null;
  collection = [];
  youkaiHp = {};
  newBattle();
}

function removeFromCollection(name){
  const idx = collection.indexOf(name);
  if(idx > -1){
    collection.splice(idx, 1);
  }
  delete youkaiHp[name];
}

function tryCatch(){
  const chance = (1 - enemy.hp/enemy.maxHp) * 0.5 + 0.05; // 弱っているほど成功率UPだが全体的に低め
  if(Math.random() < chance){
    if(!collection.includes(enemy.name)){
      collection.push(enemy.name);
    }
    youkaiHp[enemy.name] = Math.max(1, enemy.hp);
    enemy.hp = 0;
    render();
  } else {
    const edmg = enemy.atk;
    if(applyPlayerDamage(edmg)) return;
    render();
  }
}

function renderCollection(){
  const all = YOUKAI.concat(RARE_YOUKAI, BOSS_YOUKAI);
  document.getElementById('count').textContent = `${collection.length}/${all.length}`;
  const box = document.getElementById('collection');
  box.innerHTML = '';
  all.forEach(y=>{
    const got = collection.includes(y.name);
    const isActive = player && player.name === y.name;
    const d = document.createElement('div');
    d.className = 'medal'+(got?' got':'')+(y.rare?' rare':'')+(y.boss?' boss':'')+(isActive?' active':'');
    d.innerHTML = `${got?y.emoji:'❓'}<small>${got?(isActive?'★出場中':y.name):'？？？'}</small>`;
    if(got && !isActive){
      d.style.cursor = 'pointer';
      d.onclick = () => selectYoukai(y.name);
    }
    box.appendChild(d);
  });
}

function selectYoukai(name){
  const all = YOUKAI.concat(RARE_YOUKAI, BOSS_YOUKAI);
  const base = all.find(y=>y.name===name);
  if(!base) return;
  if(player) youkaiHp[player.name] = player.hp;
  const s = statsFor(base);
  const stored = youkaiHp.hasOwnProperty(name) ? youkaiHp[name] : s.maxHp;
  player = {name:base.name, emoji:base.emoji, hp:Math.min(stored, s.maxHp), maxHp:s.maxHp, atk:s.atk, def:s.def, spd:s.spd};
  log(`${player.name}が戦闘に出た！`);
  render();
}

newBattle();
</script>
